<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>노선 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 16px 34px; display: flex; flex-direction: column; gap: 20px; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', system-ui, sans-serif; color: #1C1C1E">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<div style="font-size: 13px; font-weight: 600; color: #6C6C70">경희대학교 국제캠퍼스 출발</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.4px">노선 선택</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="3">
<a href="Live.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 96px; padding: 16px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; text-decoration: none; color: #1C1C1E">
<div style="width: 52px; height: 52px; border-radius: 14px; background: {{r.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"></rect><line x1="4" y1="11" x2="20" y2="11"></line><line x1="7" y1="21" x2="7" y2="18"></line><line x1="17" y1="21" x2="17" y2="18"></line><circle cx="8" cy="14.5" r="0.6" fill="#FFFFFF"></circle><circle cx="16" cy="14.5" r="0.6" fill="#FFFFFF"></circle></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.3px">{{r.no}}</span>
<span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: {{r.soft}}; color: {{r.color}}">{{r.kind}}</span>
</div>
<div style="font-size: 14px; color: #3A3A3C">{{r.from}} → {{r.to}}</div>
<div style="font-size: 12px; color: #6C6C70">운행 중 {{r.running}}대 · 가장 가까운 버스 {{r.eta}}</div>
</div>
<svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2,2 8,8 2,14"></polyline></svg>
</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #6C6C70">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #34C759"></span>
<span>실시간 · 방금 갱신됨</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
routes: [
{ no: '5100', kind: '직행좌석', from: '경희대학교', to: '강남역', running: 4, eta: '3분', color: '#E5332A', soft: '#FDECEB' },
{ no: 'M5107', kind: '광역급행 M', from: '경희대학교', to: '서울역', running: 3, eta: '7분', color: '#B4123C', soft: '#F8E6EB' },
{ no: '1112', kind: '직행좌석', from: '경희대학교', to: '강변역', running: 2, eta: '12분', color: '#E5332A', soft: '#FDECEB' }
]
};
}
}
</script>
</body>
</html>

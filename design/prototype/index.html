<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HopOrNot 프로토타입</title>
<style>
html,body{margin:0;height:100%}
body{background:#E5E5EA;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:#1C1C1E;-webkit-font-smoothing:antialiased}
#stage{position:relative}
#phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:44px;overflow:hidden;background:#FFFFFF;box-shadow:0 20px 60px rgba(0,0,0,0.18)}
@media (max-width:499px){#phone{border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;width:390px;height:844px;overflow:hidden;font-family:inherit}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;border:0;background:transparent;color:#007AFF;font-size:17px;cursor:pointer}
.jump{min-height:44px;border:0;border-radius:12px;background:#F2F2F7;color:#1C1C1E;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.jumpsub{font-size:11px;font-weight:500;color:#6C6C70;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{display:flex;align-items:center;gap:4px}
.lgdot{width:10px;height:10px;border-radius:5px}
.stopdot{position:absolute;top:45px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;border:3px solid #C7C7CC;box-sizing:border-box}
.spinner{width:22px;height:22px;border-radius:11px;border:2.5px solid #E5E5EA;border-top-color:#6C6C70;box-sizing:border-box;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes busSlide{0%{transform:translateX(-70px)}100%{transform:translateX(70px)}}
.slide{animation:busSlide 2.4s ease-in-out infinite alternate}
@keyframes pulse{0%{transform:scale(0.85);opacity:0.9}100%{transform:scale(1.4);opacity:0}}
.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
.ring{animation:ring 1.6s ease-out infinite}
</style>
</head>

      trackedLabel: (trackedRank !== undefined ? ordinal(trackedRank) + ' 버스' : '지나간 버스') + ' 추적 중',
      statusLabel: atEnd ? '종점 도착' : atStop ? stops[cur] + ' 정차 중 · 다음 정류장' : '다음 정류장',
      nextName: stops[nextIdx], etaText: atEnd ? '도착' : (nextIdx - pos) <= 0.3 ? '곧 도착' : mins + '분',
      myLine: myLine, trackPct: toMy >= -1e-6 ? pct(tP) : '-',
      trackPctStyle: 'font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: ' + (toMy >= -1e-6 ? textOf(tP) : '#6C6C70') + ';',
      busState: atEnd ? '종점 도착' : atStop ? stops[cur] + ' 정차 중' : stops[nextIdx] + ' 가는 중',
      panStyle: 'position: absolute; inset: 0; transform: translateX(' + pan + 'px); transition: ' + (st.dragging ? 'none' : 'transform 0.35s ease') + ';',
      innerStyle: 'position: absolute; left: 0; top: 0; width: 0; height: 100%; transform: translateX(' + (C - pos * SP) + 'px); transition: ' + (tb.jump || flying ? 'none' : 'transform 3s linear') + ';',
      lineW: span * SP,
      passedStyle: 'position: absolute; left: 0; top: 130px; height: 6px; border-radius: 3px; background: ' + accent + '; width: ' + (pos * SP) + 'px; transition: ' + (tb.jump || flying ? 'none' : 'width 3s linear') + ';',
      stopItems: stopItems, ghosts: ghosts,
      myBusStyle: 'position: absolute; left: 165px; top: 86px; width: 60px; height: 42px; pointer-events: none; transform-origin: 50% 100%; transform: scale(' + busScale.toFixed(3) + '); transition: transform .45s ' + BOUNCE + '; opacity: ' + (lineVisible ? 1 : 0) + ';',
      myBusLabelStyle: 'position: absolute; left: 0; width: 390px; top: 22px; display: flex; justify-content: center; pointer-events: none; opacity: ' + (lineVisible ? 1 : 0) + '; transform: translateY(' + ((busScale - 1.45) * -40).toFixed(1) + 'px); transition: opacity .3s ease, transform .45s ' + BOUNCE + ';',
      hiddenLeft: Math.max(0, Math.ceil(vc - HALF)), hiddenRight: Math.max(0, span - Math.floor(vc + HALF)),
      panned: Math.abs(pan) > 4,
      viewLabel: d === 0 ? '좌우로 밀어서 정류장별 탑승 확률 보기' : d > 0 ? '내 버스보다 ' + d + '정류장 뒤를 보는 중' : '내 버스보다 ' + (-d) + '정류장 앞을 보는 중',
      ovBusX: pos / span * W - 6, ovMyX: my / span * W - 1,
      ovWindowStyle: 'position: absolute; top: 0; height: 18px; border-radius: 9px; background: rgba(0,122,255,0.12); border: 1.5px solid #007AFF; box-sizing: border-box; left: ' + winL + 'px; width: ' + Math.max(18, winR - winL) + 'px; transition: ' + (st.dragging ? 'none' : 'left 0.35s ease, width 0.35s ease') + ';'
    };
  }

        <span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: #EAF1FB; color: #1F5FBF; white-space: nowrap">AI 판단</span>

        <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">

      <div style="height: 0.5px; background: #D1D1D6"></div>
      <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3A3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M9 21l2-6 3 3v3"></path><path d="M8 11l3-3 3 2 3 1"></path><path d="M11 8l-1 5"></path></svg>

        <button onClick=${f.pick} aria-label=${f.aria} style=${f.btnStyle}>
          <span style=${f.nameStyle}>${f.name}</span>
          ${f.isMy ? html`<span style=${'font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: ' + v.accent + '; color: #FFFFFF'}>내 정류장</span>` : null}

        <span style=${'font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: ' + v.soft + '; color: ' + v.accent}>${v.trackedLabel}</span>

        <div class="ell" style="font-size: 12px; font-weight: 600; color: #6C6C70">${v.statusLabel}</div>
        <div class="ell" style="font-size: 20px; font-weight: 700; letter-spacing: -0.2px">${v.nextName} · ${v.etaText}</div>

      <div style=${v.panStyle}>
        <div style=${v.innerStyle}>
          <div style=${'position: absolute; left: 0; top: 130px; height: 6px; border-radius: 3px; background: #E5E5EA; width: ' + v.lineW + 'px'}></div>
          <div style=${v.passedStyle}></div>
          ${v.stopItems.map(function (s, i) {
            return html`<${Fragment} key=${'st' + i}>
              <div style=${s.dotStyle}></div>
              <div style=${s.labelWrapStyle}>
                <div style=${s.labelStyle}>${s.name}</div>
                ${s.tag ? html`<div style=${s.tagStyle}>${s.tag}</div>` : null}

          })}
          ${v.ghosts.map(function (g) { return html`<div key=${'g' + g.id} style=${g.style}>${BUS_SIDE('#8E8E93', 36, 24, '#48484A')}</div>`; })}

        <div style=${v.myBusLabelStyle}>

      </div>
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 34px; background: linear-gradient(90deg, #FFFFFF, rgba(255,255,255,0)); pointer-events: none"></div>

        <div style=${'position: absolute; top: 0; width: 2px; height: 18px; background: #1C1C1E; left: ' + v.ovMyX + 'px'}></div>
        <div style=${v.ovWindowStyle}></div>
        <div style=${'position: absolute; top: 3px; left: ' + v.ovBusX + 'px; width: 12px; height: 12px; border-radius: 6px; background: ' + v.accent + '; border: 2px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 0 0 1px ' + v.accent}></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button onClick=${this.goStart} class="jump"><span>기점</span><span class="jumpsub">${v.fromName}</span></button>
        <button onClick=${this.goBus} class="jump" style="color: #007AFF; font-weight: 700">내 버스</button>
        <button onClick=${this.goEnd} class="jump"><span>종점</span><span class="jumpsub">${v.toName}</span></button>
      </div>
    </div>
  </div>

  <div style=${v.flyStyle}>
    <span style=${v.flyTopStyle}>${BUS_TOP(v.accent)}</span>
    <span style=${v.flySideStyle}>${BUS_SIDE(v.accent, 60, 42)}</span>
  </div>

  }

  render() {
    var s = this.state.screen;
    return s === 'loading' ? this.renderLoading() : s === 'select' ? this.renderSelect() : this.renderLive();
  }
}

function fit() {
  var stage = document.getElementById('stage'), phone = document.getElementById('phone');
  var pad = window.innerWidth < 500 ? 0 : 32;
  var s = Math.min((window.innerWidth - pad) / 390, (window.innerHeight - pad) / 844, 1.25);
  window.__scale = s;
  phone.style.transform = 'scale(' + s + ')';
  stage.style.width = (390 * s) + 'px';
  stage.style.height = (844 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();
preact.render(h(App, null), document.getElementById('phone'));
})();
</script>
